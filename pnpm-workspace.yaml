packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
# sharp = native image-encoder van Next. We gebruiken een custom Shopify-CDN-loader,
# dus Next optimaliseert zelf geen beelden — maar de build-scripts toestaan houdt
# `next start` en toekomstige lokale optimalisatie werkend.
allowBuilds:
  sharp: true
  # unrs-resolver (via eslint-config-next) heeft een installscript dat enkel een fallback-
  # binary bouwt; de prebuilt binary volstaat. Expliciet weigeren: geen vreemde installcode,
  # en pnpm stopt dan niet met ERR_PNPM_IGNORED_BUILDS (lokaal, bij Jeroen en op Vercel).
  unrs-resolver: false
